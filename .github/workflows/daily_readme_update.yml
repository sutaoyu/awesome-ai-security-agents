name: Update README with Daily Security Report

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-genai requests feedparser

    - name: Fetch Data, Generate Content and Append
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python - <<EOF
        import os
        import time
        import requests
        import feedparser
        from google import genai
        from google.genai import types
        from datetime import datetime, timedelta

        print("🚀 开始混合抓取：arXiv(RSS) + GitHub(API) ...")
        
        # ==========================================
        # 1. 抓取 arXiv (稳定可靠的 RSS 官方流)
        # ==========================================
        arxiv_url = 'https://rss.arxiv.org/rss/cs.AI'
        print("正在获取 arXiv 论文流...")
        arxiv_feed = feedparser.parse(arxiv_url)
        
        arxiv_data = ""
        count = 0
        for entry in arxiv_feed.entries:
            title_lower = entry.title.lower()
            summary_lower = entry.summary.lower()
            if "agent" in title_lower or "agent" in summary_lower:
                if any(keyword in title_lower for keyword in ["security", "safety", "attack", "defense"]):
                    arxiv_data += f"- Title: {entry.title}\n- Link: {entry.link}\n- Summary: {entry.summary[:200]}...\n\n"
                    count += 1
            if count >= 4:
                break
        print(f"✅ 获取到 {count} 篇 arXiv 论文。")

        # ==========================================
        # 2. 抓取 GitHub (官方 API + 智能休眠防封锁)
        # ==========================================
        print("正在获取 GitHub 最新开源项目...")
        gh_token = os.environ.get("GITHUB_TOKEN")
        headers = {
            'Authorization': f'token {gh_token}', 
            'Accept': 'application/vnd.github.v3+json',
            'User-Agent': 'Awesome-Security-Agents-Daily-Action'
        }
        
        days_ago_str = (datetime.now() - timedelta(days=3)).strftime('%Y-%m-%d')
        gh_url = f'https://api.github.com/search/repositories?q="agent+security"+pushed:>{days_ago_str}&sort=updated&order=desc&per_page=4'
        
        gh_data = ""
        max_retries = 3
        for attempt in range(max_retries):
            try:
                gh_resp = requests.get(gh_url, headers=headers)
                
                if gh_resp.status_code == 200:
                    data = gh_resp.json()
                    items = data.get('items', [])
                    for item in items:
                        desc = item['description'] or "No description"
                        gh_data += f"- Repo: {item['name']}\n- Link: {item['html_url']}\n- Desc: {desc}\n\n"
                    print(f"✅ 获取到 {len(items)} 个 GitHub 项目。")
                    break 
                
                elif gh_resp.status_code in [403, 429]:
                    sleep_time = 30 * (attempt + 1)
                    print(f"⚠️ 触发 GitHub 搜索 API 限流保护 (状态码 {gh_resp.status_code})。深度休眠 {sleep_time} 秒后重试...")
                    time.sleep(sleep_time)
                else:
                    print(f"❌ GitHub API 请求失败: HTTP {gh_resp.status_code}")
                    break
            except Exception as e:
                print(f"网络异常: {e}")
                break

        raw_context = f"=== NEW ARXIV PAPERS ===\n{arxiv_data}\n=== NEW GITHUB REPOS ===\n{gh_data}"
        
        if not arxiv_data and not gh_data:
            print("⚠️ 今日未抓取到任何新数据，Action 将提前正常退出，不更新 README。")
            exit(0)

        # ==========================================
        # 3. Gemini 数据融合排版 (恢复严格模板约束)
        # ==========================================
        print("🤖 正在将抓取到的数据交给 Gemini 3.5 Flash 进行智能化排版...")
        client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
        
        prompt = f"""
        You are an expert AI cybersecurity analyst. I have just scraped the latest raw data from arXiv and GitHub.
        
        RAW DATA:
        {raw_context}

        YOUR TASK:
        Review the RAW DATA above and format it into a clean, professional markdown brief.
        
        CRITICAL RULES:
        1. ONLY use the information provided in the RAW DATA. DO NOT use your internal knowledge to make up papers or repos.
        2. Keep descriptions concise.
        3. Extract the exact Links provided in the raw data.
        4. ALL OUTPUT MUST BE IN ENGLISH.
        
        STRICT OUTPUT FORMAT (You MUST use this exact structure, max 3 items per category):
        #### 🛡️ Agents for Security
        * **[Name]** - [Brief Description] [Link]

        #### 🔒 Security of Agents
        * **[Name]** - [Brief Description] [Link]
        """
        
        max_gemini_retries = 3
        report_text = "> ⚠️ *Gemini generation resulted in empty text or failed.*"
        
        for attempt in range(max_gemini_retries):
            try:
                response = client.models.generate_content(
                    model='gemini-3.5-flash',
                    contents=prompt,
                    config=types.GenerateContentConfig(temperature=0.1)
                )
                report_text = response.text if response.text else "> ⚠️ *Gemini generation resulted in empty text.*"
                print("✅ Gemini 排版成功完成！")
                break # 成功则跳出循环
                
            except Exception as e:
                error_msg = str(e)
                if "503" in error_msg or "UNAVAILABLE" in error_msg or "429" in error_msg:
                    sleep_time = 20 * (attempt + 1)
                    print(f"⚠️ Gemini 遇到高并发或限流 (尝试 {attempt + 1}/{max_gemini_retries})。休眠 {sleep_time} 秒后重试...")
                    time.sleep(sleep_time)
                else:
                    print(f"❌ Gemini 生成遇到不可恢复的报错: {error_msg}")
                    exit(1) # 非限流/高并发错误，直接退出
        
        # 如果重试 3 次后依然没有获取到有效文本，可以设置一个兜底，避免覆盖坏数据
        if "⚠️" in report_text and attempt == max_gemini_retries - 1:
            print("❌ 多次重试后 Gemini 依然无响应，放弃本次 README 更新。")
            exit(1)

        # ==========================================
        # 4. 追加写入 README.md
        # ==========================================
        today_str = datetime.now().strftime("%Y-%m-%d")
        report_content = f"\n### 📅 Daily Security Intelligence ({today_str})\n\n"
        report_content += "> 💡 *Note: Data fetched directly via arXiv/GitHub APIs and formatted by Gemini 3.5 Flash.* \n\n"
        report_content += report_text + "\n\n---\n"

        readme_path = "README.md"
        with open(readme_path, "r", encoding="utf-8") as f:
            readme_text = f.read()

        # 修复了丢失的占位符变量
        marker = ""
        if marker not in readme_text:
            print("❌ 致命错误：在 README.md 中未找到插入占位符！")
            exit(1)
            
        new_readme_text = readme_text.replace(marker, f"{marker}\n{report_content}", 1)

        with open(readme_path, "w", encoding="utf-8") as f:
            f.write(new_readme_text)
            
        print("🎉 README.md 历史追加更新成功！")
        EOF

    - name: Commit and Push
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action Bot"
        git add README.md
        git diff-index --quiet HEAD || git commit -m "docs: 🤖 Auto-append daily security brief ($(date +'%Y-%m-%d'))"
        git push
