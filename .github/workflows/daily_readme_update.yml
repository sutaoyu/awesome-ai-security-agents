name: Update README with Daily Security Report

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-genai requests

    - name: Generate Content and Append to README
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python - <<EOF
        import os
        import re
        import requests
        from google import genai
        from google.genai import types
        from datetime import datetime

        client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
        
        # 1. Prompt configuration (Strictly English, internal knowledge)
        prompt = """
        Based on your internal knowledge base, summarize recent and highly regarded academic papers and open-source projects related to "agent security".
        Keywords: "LLM Agent for cybersecurity", "Autonomous pentesting agent", "Prompt injection defense", "Agent safety benchmarks". 
        Sources to consider: arXiv, Hugging Face, GitHub.

        CRITICAL RULES FOR URLs:
        1. DO NOT guess, fabricate, or hallucinate URLs. 
        2. If you are unsure of the exact URL, explicitly write "https://notfoundco.com/" instead of making up a link.
        3. Prioritize factual accuracy over providing a link.

        Output format (max 3 items per category, ALL OUTPUT MUST BE IN ENGLISH):
        #### 🛡️ Agents for Security
        * **[Name]** - [Brief Description] [Link]

        #### 🔒 Security for Agents
        * **[Name]** - [Brief Description] [Link]
        """
        
        print("Requesting security intelligence from Gemini (Internal Knowledge Base mode)...")
        
        response = client.models.generate_content(
            model='gemini-3.5-flash',
            contents=prompt,
            config=types.GenerateContentConfig(
                temperature=0.2 
            )
        )
        
        # 2. Fallback mechanism for empty responses
        if response.text:
            raw_text = response.text
        else:
            print("WARNING: Gemini returned an empty response. This might be due to safety filters.")
            raw_text = "> ⚠️ *Gemini returned an empty response, possibly due to safety filters or knowledge base limitations. Please wait for the next daily update.*"

        # 3. Local URL validation (Dead-link checker)
        print("Generation complete. Validating URLs locally...")
        url_pattern = re.compile(r'\[([^\]]+)\]\((https?://[^\)]+)\)')
        
        def verify_link(match):
            text, url = match.groups()
            try:
                headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
                res = requests.head(url, headers=headers, timeout=5, allow_redirects=True)
                if res.status_code < 400:
                    return match.group(0) 
                else:
                    return f"[{text} (⚠️ Link Broken, HTTP {res.status_code})]({url})"
            except:
                return f"[{text} (⚠️ Link Unreachable)]({url})"

        verified_text = url_pattern.sub(verify_link, raw_text)

        # 4. Assemble final English text (with divider for historical append)
        today_str = datetime.now().strftime("%Y-%m-%d")
        report_content = f"\n### 📅 Daily Security Intelligence ({today_str})\n\n"
        report_content += "> 💡 *Note: This section is automatically summarized daily by Gemini 3.5 Flash and verified by an automated dead-link checker.* \n\n"
        report_content += verified_text + "\n\n---\n"

        readme_path = "README.md"
        with open(readme_path, "r", encoding="utf-8") as f:
            readme_text = f.read()

        # 5. Safe Append Logic (Inserts directly below START_REPORT)
        marker = ""
        
        if marker not in readme_text:
            print("❌ FATAL ERROR: placeholder not found in README.md! Operation aborted.")
            exit(1)
            
        # Clean up the initial waiting message if it exists
        readme_text = readme_text.replace("### ⏳ Waiting for automated daily intelligence injection...\n", "")
        
        # Insert today's report right after the marker
        new_readme_text = readme_text.replace(marker, f"{marker}\n{report_content}", 1)

        with open(readme_path, "w", encoding="utf-8") as f:
            f.write(new_readme_text)
            
        print("README.md historical append successful!")
        EOF

    - name: Commit and Push
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action Bot"
        git add README.md
        git diff-index --quiet HEAD || git commit -m "docs: 🤖 Auto-append daily security brief ($(date +'%Y-%m-%d'))"
        git push
